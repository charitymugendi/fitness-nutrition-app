
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="auth-container">
        <h2>Create Your Account</h2>

        <form id="signupForm" class="auth-form">
            <input type="text" id="name" placeholder="Full Name" required title="Full Name">
            <input type="email" id="email" placeholder="Email" required title="Email Address">
            <input type="password" id="password" placeholder="Password" required title="Password">
            <button type="submit" class="cta-button primary">Sign Up</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
