<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="auth-container">
        <h2>Login to Your Account</h2>

        <form id="loginForm" class="auth-form">
            <input type="email" id="email" placeholder="Email" required title="Email Address">
            <input type="password" id="password" placeholder="Password" required title="Password">
            <button type="submit" class="cta-button primary">Login</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
