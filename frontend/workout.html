        :root {
            --primary-color: #f75d59; /* Red/Orange from the image */
            --secondary-color: #1f2937; /* Dark text */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        
        /* Custom styling for the video player modal overlay */
        .video-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex; 
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
        }
        .hidden-initial {
            display: none;
            opacity: 0;
        }
        .video-modal-content {
            position: relative;
            width: 90%;
            max-width: 900px;
            padding: 20px;
            background: #000;
            border-radius: 12px;
        }
        /* 16:9 Aspect Ratio container for the iframe */
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 9 / 16 * 100 */
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        .close-button {
            position: absolute;
            top: -15px;
            right: -15px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            background: var(--primary-color);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        /* Loading states */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
        
        /* Admin controls */
        .admin-controls {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 10px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0056b3;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }

        .img-filter-invert {
            filter: brightness(0) invert(1);
        }

        /* Category section styling */
        .category-section {
            margin-bottom: 2rem;
        }
        
        .category-header {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1f2937;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .difficulty-section {
            margin-bottom: 1.5rem;
        }
        
        .difficulty-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #374151;
            display: flex;
            align-items: center;
        }
        
        .difficulty-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        
        .beginner-badge {
            background-color: #dcfce7;
            color: #166534;
        }
        
        .intermediate-badge {
            background-color: #fef3c7;
            color: #92400e;
        }
        
        .advanced-badge {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>

                </div>
                <div class="form-group">
                    <label for="video-muscle-group">Muscle Group *</label>

                        <option value="Chest">Chest</option>

                        <option value="Shoulder">Shoulder</option>

                </div>
                <div class="form-group">
                    <label for="video-exercises">Number of Exercises *</label>
                    <input type="number" id="video-exercises" name="exercises" required min="1" placeholder="e.g., 15">
                </div>
                <div class="form-group">
                    <label for="video-difficulty">Difficulty *</label>
                    <select id="video-difficulty" name="difficulty" required>

                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>

                </div>
                <div class="form-group">

                </div>
                <div class="form-group md:col-span-2">
                    <label for="video-thumbnail">Thumbnail URL (Optional)</label>

                </div>
            </div>

        // --- VIDEO PLAYER MODAL LOGIC ---
        const setupVideoPlayer = () => {
            const modal = document.getElementById('video-modal');
            const closeButton = modal.querySelector('.close-button');
            
            closeButton.onclick = () => closeModal();
            modal.onclick = (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            };
            
            window.closeModal = () => {
                const iframe = document.getElementById('video-iframe');
                iframe.src = ''; 
                modal.classList.add('hidden-initial');
            };
        };

        const openModal = (videoUrl) => {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('video-iframe');
            
            const embedUrl = videoUrl.includes('?') ? `${videoUrl}&autoplay=1` : `${videoUrl}?autoplay=1`;
            iframe.src = embedUrl;

            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.remove('hidden-initial');
            }, 10);
        };

        // --- ADMIN CONTROLS LOGIC ---
        const toggleAdminControls = () => {
            const adminControls = document.getElementById('admin-controls');
            const showAdminBtn = document.getElementById('show-admin');
            const toggleAdminBtn = document.getElementById('toggle-admin');
            
            isAdminMode = !isAdminMode;
            
            if (isAdminMode) {
                adminControls.classList.remove('hidden-initial');
                showAdminBtn.style.display = 'none';
                toggleAdminBtn.textContent = '🚫 Exit Admin Mode';
            } else {
                adminControls.classList.add('hidden-initial');
                showAdminBtn.style.display = 'block';
                toggleAdminBtn.textContent = '👤 Admin Mode';
                document.getElementById('add-video-form').reset();
            }
            
            // Refresh display to show/hide delete buttons
            filterAndDisplayVideos();
        };

        const addNewVideo = async (videoData) => {
            const spinner = document.querySelector('#add-video-form .loading-spinner');
            const submitBtn = document.querySelector('#add-video-form button[type="submit"]');
            
            try {
                spinner.classList.remove('hidden');
                submitBtn.disabled = true;
                
                const response = await fetch(`${API_BASE_URL}/api/workouts/videos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(videoData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to add video');
                }
                
                const result = await response.json();
                showSuccess('Video added successfully!');
                document.getElementById('add-video-form').reset();
                toggleAdminControls();
                
                // Reload the videos to show the new one
                await loadWorkoutVideos();
                
            } catch (error) {
                console.error('Error adding video:', error);
                showError(`Failed to add video: ${error.message}`);
            } finally {
                spinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        };

        // --- CORE WORKOUT LOGIC ---
        const getDifficultyStars = (difficulty) => {
            if (difficulty === 'beginner') return { count: 1, color: 'text-green-500' };
            if (difficulty === 'intermediate') return { count: 2, color: 'text-yellow-500' };
            if (difficulty === 'advanced') return { count: 3, color: 'text-red-500' };
            return { count: 0, color: 'text-gray-400' };
        };

        const getDifficultyBadge = (difficulty) => {
            if (difficulty === 'beginner') return 'beginner-badge';
            if (difficulty === 'intermediate') return 'intermediate-badge';
            if (difficulty === 'advanced') return 'advanced-badge';
            return '';
        };

        const getDifficultyText = (difficulty) => {
            if (difficulty === 'beginner') return 'Beginner';
            if (difficulty === 'intermediate') return 'Intermediate';
            if (difficulty === 'advanced') return 'Advanced';
            return '';
        };

        const createVideoCard = (video) => {
            const card = document.createElement('div');
            card.className = 'flex items-center space-x-4 bg-white p-4 rounded-xl shadow-md cursor-pointer hover:bg-gray-100 transition duration-200';
            
            card.onclick = () => openModal(video.embed_url);

            const thumbnailUrl = video.thumbnail_url || `https://placehold.co/64x64/3b82f6/ffffff?text=${video.muscle_group}`;
            
            const { count: starCount, color: starColor } = getDifficultyStars(video.difficulty);
            const difficultyStars = '⭐'.repeat(starCount);
            
            const lastCompletedText = video.last_completed ? 
                `<p class="text-xs text-blue-600 font-semibold mt-1">Last time: ${video.last_completed}</p>` : '';

            card.innerHTML = `
                <img src="${thumbnailUrl}" alt="${video.title} Thumbnail" class="w-16 h-16 object-cover rounded-lg flex-shrink-0 shadow">
                <div class="flex-grow">
                    <h3 class="text-base font-semibold text-gray-800">${video.title}</h3>
                    <div class="flex items-center text-sm text-gray-500 space-x-2">
                        <span>${video.duration} mins</span>
                        <span>•</span>
                        <span>${video.exercises} Exercises</span>
                    </div>
                    ${lastCompletedText}
                </div>
                <div class="flex flex-col items-end text-sm font-medium">
                    <div class="${starColor}">
                        ${difficultyStars}
                    </div>
                    ${isAdminMode ? `<button class="delete-video mt-1 text-xs text-red-500 hover:text-red-700" data-id="${video.id}">🗑️ Delete</button>` : ''}
                </div>
            `;
            
            // Add delete functionality in admin mode
            if (isAdminMode) {
                const deleteBtn = card.querySelector('.delete-video');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteVideo(video.id);
                });
            }
            
            return card;
        };

        const deleteVideo = async (videoId) => {
            if (!confirm('Are you sure you want to delete this video?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/workouts/videos/${videoId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete video');
                }
                
                showSuccess('Video deleted successfully!');
                await loadWorkoutVideos();
                
            } catch (error) {
                console.error('Error deleting video:', error);
                showError('Failed to delete video');
            }
        };

        const filterAndDisplayVideos = () => {
            const grid = document.getElementById('workout-grid');
            grid.innerHTML = '';

            // Check if we have structured data for the current filter
            if (workoutVideosData[currentFilter]) {
                displayCategoryWithSubcategories(currentFilter);
            } else {
                // For other categories, use the original display method
                const filteredVideos = allVideos.filter(video => video.muscle_group === currentFilter);
                
                if (filteredVideos.length === 0) {
                    grid.innerHTML = `
                        <div class="text-center text-gray-500 mt-8 py-8">
                            <p class="text-lg">No ${currentFilter} workout videos found.</p>
                            ${isAdminMode ? '<p class="text-sm mt-2">Use the "Add Video" button to create one!</p>' : ''}
                        </div>
                    `;
                } else {
                    const sortedVideos = filteredVideos.sort((a, b) => {
                        const order = { 'beginner': 1, 'intermediate': 2, 'advanced': 3 };
                        return order[a.difficulty] - order[b.difficulty];
                    });
                    
                    sortedVideos.forEach(video => {
                        grid.appendChild(createVideoCard(video));
                    });
                }
            }

            // Update tab styling
            document.querySelectorAll('.filter-tab').forEach(tab => {
                if (tab.getAttribute('data-muscle') === currentFilter) {
                    tab.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-100');
                    tab.classList.add('bg-blue-600', 'text-white');
                } else {
                    tab.classList.remove('bg-blue-600', 'text-white');
                    tab.classList.add('bg-white', 'text-gray-700', 'hover:bg-gray-100');
                }
            });
        };

        const displayCategoryWithSubcategories = (category) => {
            const grid = document.getElementById('workout-grid');
            
            // Get videos from our sample data
            const categoryVideos = workoutVideosData[category];
            
            if (!categoryVideos) {
                grid.innerHTML = `
                    <div class="text-center text-gray-500 mt-8 py-8">
                        <p class="text-lg">No ${category} workout videos found.</p>
                    </div>
                `;
                return;
            }
            
            // Create category section
            const categorySection = document.createElement('div');
            categorySection.className = 'category-section';
            
            // Add Beginner section
            if (categoryVideos.beginner && categoryVideos.beginner.length > 0) {
                const beginnerSection = document.createElement('div');
                beginnerSection.className = 'difficulty-section';
                beginnerSection.innerHTML = `
                    <div class="difficulty-header">
                        Beginner Workouts
                        <span class="difficulty-badge beginner-badge">${categoryVideos.beginner.length} workouts</span>
                    </div>
                `;
                
                categoryVideos.beginner.forEach(video => {
                    beginnerSection.appendChild(createVideoCard(video));
                });
                
                categorySection.appendChild(beginnerSection);
            }
            
            // Add Intermediate section
            if (categoryVideos.intermediate && categoryVideos.intermediate.length > 0) {
                const intermediateSection = document.createElement('div');
                intermediateSection.className = 'difficulty-section';
                intermediateSection.innerHTML = `
                    <div class="difficulty-header">
                        Intermediate Workouts
                        <span class="difficulty-badge intermediate-badge">${categoryVideos.intermediate.length} workouts</span>
                    </div>
                `;
                
                categoryVideos.intermediate.forEach(video => {
                    intermediateSection.appendChild(createVideoCard(video));
                });
                
                categorySection.appendChild(intermediateSection);
            }
            
            // Add Advanced section
            if (categoryVideos.advanced && categoryVideos.advanced.length > 0) {
                const advancedSection = document.createElement('div');
                advancedSection.className = 'difficulty-section';
                advancedSection.innerHTML = `
                    <div class="difficulty-header">
                        Advanced Workouts
                        <span class="difficulty-badge advanced-badge">${categoryVideos.advanced.length} workouts</span>
                    </div>
                `;
                
                categoryVideos.advanced.forEach(video => {
                    advancedSection.appendChild(createVideoCard(video));
                });
                
                categorySection.appendChild(advancedSection);
            }
            
            grid.appendChild(categorySection);
        };

        const loadWorkoutVideos = async () => {
            const grid = document.getElementById('workout-grid');
            grid.innerHTML = `
                <div class="text-center py-8">
                    <div class="loading-spinner mx-auto"></div>
                    <p class="text-gray-500 mt-2">Loading workout videos...</p>
                </div>
            `;

            try {
                console.log('🔄 Fetching workout videos from API...');
                const response = await fetch(`${API_BASE_URL}/api/workouts/videos`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const videos = await response.json();
                console.log(`✅ Loaded ${videos.length} videos from database`);
                
                allVideos = videos;
                filterAndDisplayVideos();
                
            } catch (error) {
                console.error('❌ Error loading workout videos:', error);
                // If API fails, use sample data for demonstration
                console.log('Using sample workout data for demonstration');
                
                // Convert sample data to flat array for other categories
                const sampleVideos = [];
                Object.keys(workoutVideosData).forEach(muscleGroup => {
                    Object.keys(workoutVideosData[muscleGroup]).forEach(difficulty => {
                        sampleVideos.push(...workoutVideosData[muscleGroup][difficulty]);
                    });
                });
                
                allVideos = sampleVideos;
                filterAndDisplayVideos();
            }
        };

        // --- UTILITY FUNCTIONS ---
        const showError = (message) => {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        };

        const showSuccess = (message) => {
            // Create a temporary success message
            const successDiv = document.createElement('div');
            successDiv.className = 'bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4';
            successDiv.textContent = message;
            
            const header = document.querySelector('header');
            header.parentNode.insertBefore(successDiv, header.nextSibling);
            
            setTimeout(() => {
                successDiv.remove();
            }, 3000);
        };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Setup the modal structure
            setupVideoPlayer();

            // 2. Load the videos from API
            loadWorkoutVideos();
            
            // 3. Attach listeners to the filter tabs
            const filterTabs = document.querySelectorAll('.filter-tab');
            filterTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const muscleGroup = e.currentTarget.getAttribute('data-muscle');
                    if (currentFilter !== muscleGroup) {
                        currentFilter = muscleGroup;
                        filterAndDisplayVideos();
                    }
                });
            });

            // 4. Admin controls setup
            document.getElementById('show-admin').addEventListener('click', toggleAdminControls);
            document.getElementById('toggle-admin').addEventListener('click', toggleAdminControls);
            document.getElementById('cancel-add').addEventListener('click', toggleAdminControls);
            
            document.getElementById('add-video-form').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const formData = new FormData(e.target);
                const videoData = {
                    title: formData.get('title'),
                    muscle_group: formData.get('muscle_group'),
                    duration: parseInt(formData.get('duration')),
                    exercises: parseInt(formData.get('exercises')),
                    difficulty: formData.get('difficulty'),
                    embed_url: formData.get('embed_url'),
                    thumbnail_url: formData.get('thumbnail_url') || ''
                };
                
                addNewVideo(videoData);
            });

            // 5. Close modal with ESC key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
